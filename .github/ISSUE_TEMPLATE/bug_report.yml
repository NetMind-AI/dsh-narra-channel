name: Bug report
description: Report a reproducible problem with the Narra channel plugin.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not include setup-guide URLs, Gateway tokens, API keys, credentials, or private conversation content.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: 0.1.5
    validations:
      required: true
  - type: input
    id: harness-version
    attributes:
      label: DeepSeek Harness version
      placeholder: 0.1.0-rc.8
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - GitHub release tarball
        - Locally built tarball
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the failure and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Install the plugin...
        2. Bind a preset...
        3. Send a message...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Remove all tokens, URLs containing binding codes, credentials, and private content.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I reproduced this with the plugin version listed above.
          required: true
        - label: I removed secrets and private conversation content from this report.
          required: true
