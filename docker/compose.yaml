name: dsh-narra

services:
  harness:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        DSH_VERSION: 0.1.0-rc.8
        NARRA_PLUGIN_VERSION: 0.1.5
    image: local/deepseek-harness-narra:0.1.0-rc.8-plugin-0.1.5
    container_name: dsh-narra-harness
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 4g
    cpus: 2.0
    ports:
      - 127.0.0.1:3081:3081
    environment:
      TZ: Asia/Shanghai
    volumes:
      - dsh_home:/var/lib/dsh
      - agent_workspace:/workspace
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=1777
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3081/"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  dsh_home:
  agent_workspace:
